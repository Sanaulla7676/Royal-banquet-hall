name: Site checks
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin-studio.js
          node --check assets/js/royal-cms.js
          node --check server.js
          node --check lib/admin-auth.js
          node --check lib/cms-db.js
          if [ -d api ]; then find api -name '*.js' -print0 | xargs -0 -r -n1 node --check; fi
      - name: Python syntax
        run: python -m py_compile server.py
      - name: Browser-level Admin Studio QA
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          python -m http.server 4173 > /tmp/studio-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/admin-studio.html >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/admin-studio.spec.cjs --reporter=line
