name: Site checks
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: JavaScript syntax
        run: |
          node --check assets/js/admin-studio.js
          node --check assets/js/royal-cms.js
          node --check server.js
          node --check lib/admin-auth.js
          node --check lib/cms-db.js
          find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Python syntax
        run: python -m py_compile server.py
